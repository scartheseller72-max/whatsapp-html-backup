name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax-check all source files
        run: |
          set -e
          for f in $(find src bin -name '*.js'); do
            echo "checking $f"
            node --check "$f"
          done

      - name: Run unit tests (no external deps required)
        run: node --test
